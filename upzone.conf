server {
    listen 80;
    listen [::]:80;
    
    # Ganti dengan nama domain Anda saat deploy
    server_name upzone.com www.upzone.com;

    # Ganti dengan path direktori tempat Anda meletakkan file project di VPS
    root /var/www/upzone;
    index index.html;

    # Redirect semua error 404 ke index.html (Berguna jika menggunakan History API SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Blokir akses ke file tersembunyi (seperti .git, .env, .htaccess)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Konfigurasi GZIP Compression untuk mempercepat loading
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Browser Caching untuk file statis (CSS, JS, Gambar)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}
